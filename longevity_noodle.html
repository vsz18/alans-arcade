<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>长寿面 Longevity Noodle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100vh; overflow: hidden; }
  body {
    background: #1a0505;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Arial Black', Arial, sans-serif;
    color: #fff;
    user-select: none;
  }
  #wrap { display: flex; flex-direction: column; align-items: center; transform-origin: top center; }
  #topbar {
    display: flex; justify-content: space-between; align-items: center;
    width: 500px; max-width: 100%; margin-bottom: 4px;
  }
  .tb-btn {
    background: #1a0505; color: #ffd700; border: 2px solid #cc0000;
    font-family: inherit; font-size: 0.7rem; font-weight: bold;
    padding: 5px 13px; cursor: pointer; letter-spacing: 1px;
  }
  .tb-btn:hover { background: #2d0808; }
  #topbar-title {
    color: #ffd700; font-size: 0.85rem; letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
  }
  #hud {
    display: flex; gap: 30px; margin-bottom: 6px;
    font-size: 0.9rem; color: #ffd700;
    width: 500px; max-width: 100%; justify-content: center;
  }
  #canvas-wrap { position: relative; }
  canvas { display: block; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(10,0,0,0.85);
    gap: 8px;
  }
  #overlay .chinese {
    font-size: 3rem; color: #cc0000; letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(200,0,0,0.9), 0 0 40px rgba(200,0,0,0.4);
  }
  #overlay h2 {
    font-size: 1.5rem; color: #ffd700;
    text-shadow: 0 0 16px rgba(255,215,0,0.7);
  }
  #overlay p { font-size: 0.85rem; color: #ccc; line-height: 2; text-align: center; }
  #overlay .food-key { font-size: 1rem; color: #ffd700; letter-spacing: 1px; }
  #overlay button {
    margin-top: 6px; padding: 10px 30px;
    font-size: 1rem; font-family: inherit;
    background: #cc0000; color: #ffd700; border: 2px solid #ffd700;
    cursor: pointer; font-weight: bold; letter-spacing: 1px;
  }
  #overlay button:hover { background: #ff2222; }
  footer { margin-top: 8px; color: #553333; font-size: 0.8rem; }
</style>
</head>
<body>
<div id="wrap">
<div id="topbar">
  <button class="tb-btn" onclick="goBack()">← BACK</button>
  <span id="topbar-title">长寿面 · LONGEVITY NOODLE</span>
  <div style="display:flex;gap:6px">
    <button class="tb-btn" id="musicBtn" onclick="toggleMusic()">♪ ON</button>
    <button class="tb-btn" id="pauseBtn" onclick="togglePause()">⏸ PAUSE</button>
  </div>
</div>
<div id="hud">
  <span>SCORE: <span id="score">0</span></span>
  <span>BEST: <span id="best">0</span></span>
  <span>LENGTH: <span id="length">1</span></span>
</div>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="overlay">
    <div class="chinese">长寿面</div>
    <h2>🍜 LONGEVITY NOODLE</h2>
    <p>In Chinese culture, eating a long unbroken<br>
       noodle brings a long life. Don't break yours!🥢</p>
    <p class="food-key">🍑 +10 &nbsp;&nbsp; 🥟 +30 &nbsp;&nbsp; 🧧 +50 &nbsp;&nbsp; 🎂 +100</p>
    <button id="startBtn">▶ START</button>
  </div>
</div>
<footer>Arrow Keys / WASD to move &nbsp;|&nbsp; P or Esc to pause</footer>

<script>
const CELL = 20;
const COLS = 25;
const ROWS = 25;
const HS_KEY = 'longevity-noodle-hi';
const LOW_PERF = window.matchMedia('(pointer: coarse)').matches;

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = COLS * CELL;
canvas.height = ROWS * CELL;

const NOODLE_COLOR = '#f5c030';
const NOODLE_HI    = 'rgba(255,248,190,0.38)';

const FOODS = [
  { type: 'peach',    emoji: '🍑', pts:  10, weight: 50 },
  { type: 'dumpling', emoji: '🥟', pts:  30, weight: 28 },
  { type: 'envelope', emoji: '🧧', pts:  50, weight: 17 },
  { type: 'cake',     emoji: '🎂', pts: 100, weight:  5 },
];

// ── State ──────────────────────────────────────────────────────────────────
let snake, dir, nextDir, food;
let score, state, animFrame, foodEaten;
let moveTimer = null, moveInterval = 160;
let deathFrame = 0;

// ── Helpers ────────────────────────────────────────────────────────────────
function loadHi()  { return parseInt(localStorage.getItem(HS_KEY) || '0', 10); }
function saveHi(s) { if (s > loadHi()) localStorage.setItem(HS_KEY, s); }

function updateHUD() {
  document.getElementById('score').textContent  = score;
  document.getElementById('best').textContent   = loadHi();
  document.getElementById('length').textContent = snake.length;
}

// ── Init ───────────────────────────────────────────────────────────────────
function startGame() {
  snake = [{x:12,y:12},{x:11,y:12},{x:10,y:12}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; foodEaten = 0;
  moveInterval = 160; deathFrame = 0;
  state = 'playing';
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('pauseBtn').textContent = '⏸ PAUSE';
  spawnFood(); updateHUD();
  if (moveTimer) clearInterval(moveTimer);
  moveTimer = setInterval(step, moveInterval);
  startMusic();
}

// ── Food ───────────────────────────────────────────────────────────────────
function spawnFood() {
  const roll = Math.random() * 100;
  let cum = 0, chosen = FOODS[0];
  for (const f of FOODS) { cum += f.weight; if (roll < cum) { chosen = f; break; } }
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = { ...pos, ...chosen };
}

// ── Game step ──────────────────────────────────────────────────────────────
function step() {
  if (state !== 'playing') return;
  dir = { ...nextDir };

  const nx = (snake[0].x + dir.x + COLS) % COLS;
  const ny = (snake[0].y + dir.y + ROWS) % ROWS;

  // Self-collision (skip last segment — it's about to move away)
  if (snake.slice(1, -1).some(s => s.x === nx && s.y === ny)) { die(); return; }

  snake.unshift({ x: nx, y: ny });

  if (food && nx === food.x && ny === food.y) {
    eatSound(food.pts);
    score += food.pts;
    foodEaten++;
    saveHi(score);
    spawnFood();
    if (foodEaten % 5 === 0) {
      moveInterval = Math.max(80, moveInterval - 12);
      clearInterval(moveTimer);
      moveTimer = setInterval(step, moveInterval);
    }
  } else {
    snake.pop();
  }
  updateHUD();
}

function die() {
  state = 'dead';
  deathFrame = 0;
  clearInterval(moveTimer);
  stopMusic();
  saveHi(score);
  updateHUD();
}

// ── Drawing ────────────────────────────────────────────────────────────────
let gridCanvas = null;

function buildGridCanvas() {
  gridCanvas = document.createElement('canvas');
  gridCanvas.width = canvas.width; gridCanvas.height = canvas.height;
  const gc = gridCanvas.getContext('2d');
  const grad = gc.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#1a0505');
  grad.addColorStop(1, '#0d0202');
  gc.fillStyle = grad;
  gc.fillRect(0, 0, canvas.width, canvas.height);
  gc.strokeStyle = 'rgba(160,20,20,0.14)';
  gc.lineWidth = 0.5;
  for (let c = 0; c <= COLS; c++) {
    gc.beginPath(); gc.moveTo(c*CELL, 0); gc.lineTo(c*CELL, canvas.height); gc.stroke();
  }
  for (let r = 0; r <= ROWS; r++) {
    gc.beginPath(); gc.moveTo(0, r*CELL); gc.lineTo(canvas.width, r*CELL); gc.stroke();
  }
  gc.save();
  gc.fillStyle = 'rgba(160,20,20,0.07)';
  gc.font = 'bold 200px serif';
  gc.textAlign = 'center';
  gc.textBaseline = 'middle';
  gc.fillText('福', canvas.width/2, canvas.height/2);
  gc.restore();
}

function drawBg() {
  if (!gridCanvas) buildGridCanvas();
  ctx.drawImage(gridCanvas, 0, 0);
}

// Returns the canvas position of segment i with a subtle living wobble
function segPt(i) {
  const s = snake[i];
  if (LOW_PERF) return { x: s.x * CELL + CELL/2, y: s.y * CELL + CELL/2 };
  const w = 1.4;
  return {
    x: s.x * CELL + CELL/2 + Math.sin(animFrame * 0.055 + i * 0.75) * w,
    y: s.y * CELL + CELL/2 + Math.cos(animFrame * 0.055 + i * 0.82) * w,
  };
}

// Calls fn(fromIdx, toIdx) for each continuous run of segments (breaks at wrap-arounds)
function eachRun(fn) {
  let start = 0;
  for (let i = 1; i <= snake.length; i++) {
    const atEnd = i === snake.length;
    const wraps = !atEnd && (
      Math.abs(snake[i].x - snake[i-1].x) > 1 ||
      Math.abs(snake[i].y - snake[i-1].y) > 1
    );
    if (atEnd || wraps) { fn(start, i - 1); start = i; }
  }
}

function strokeRuns(lineWidth, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth   = lineWidth;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  eachRun((from, to) => {
    ctx.beginPath();
    ctx.moveTo(segPt(from).x, segPt(from).y);
    for (let j = from + 1; j <= to; j++) ctx.lineTo(segPt(j).x, segPt(j).y);
    ctx.stroke();
  });
}

function drawNoodle() {
  if (!snake.length) return;

  const alpha = state === 'dead' ? Math.max(0, 1 - deathFrame / 50) : 1;
  const color = state === 'dead'
    ? `hsl(${(deathFrame * 8) % 360}, 85%, 55%)`
    : NOODLE_COLOR;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowBlur  = LOW_PERF ? 0 : (state === 'dead' ? 16 : 6);
  ctx.shadowColor = state === 'dead' ? '#ff2222' : 'rgba(245,190,40,0.55)';

  strokeRuns(CELL * 0.76, color);

  if (state !== 'dead' && !LOW_PERF) {
    ctx.shadowBlur = 0;
    strokeRuns(CELL * 0.28, NOODLE_HI);
  }

  ctx.restore();
  drawHead(alpha);
}

function drawHead(alpha) {
  const h  = snake[0];
  const hx = h.x * CELL + CELL/2;
  const hy = h.y * CELL + CELL/2;
  const r  = CELL * 0.46;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle   = state === 'dead' ? '#ff4444' : '#fad040';
  ctx.shadowBlur  = LOW_PERF ? 0 : 8;
  ctx.shadowColor = state === 'dead' ? '#ff0000' : 'rgba(250,200,40,0.8)';
  ctx.beginPath(); ctx.arc(hx, hy, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  if (state !== 'dead') {
    const perpX = -dir.y, perpY = dir.x;
    const fwd = r * 0.3, ep = r * 0.29;
    const ex1x = hx + dir.x*fwd + perpX*ep, ex1y = hy + dir.y*fwd + perpY*ep;
    const ex2x = hx + dir.x*fwd - perpX*ep, ex2y = hy + dir.y*fwd - perpY*ep;

    ctx.fillStyle = '#1a0000';
    ctx.beginPath(); ctx.arc(ex1x, ex1y, r*0.19, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2x, ex2y, r*0.19, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex1x + r*0.06, ex1y - r*0.06, r*0.07, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2x + r*0.06, ex2y - r*0.06, r*0.07, 0, Math.PI*2); ctx.fill();
  } else {
    // × eyes on death
    const d = r * 0.22;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8;
    [-r*0.3, r*0.3].forEach(ox => {
      ctx.beginPath(); ctx.moveTo(hx+ox-d, hy-d); ctx.lineTo(hx+ox+d, hy+d); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx+ox+d, hy-d); ctx.lineTo(hx+ox-d, hy+d); ctx.stroke();
    });
  }
  ctx.restore();
}

function drawFood() {
  if (!food) return;
  const fx = food.x * CELL + CELL/2;
  const fy = food.y * CELL + CELL/2;
  const pulse = 0.88 + 0.12 * Math.sin(animFrame * 0.11);
  const glowMap = { peach:'#ff9f43', dumpling:'#74b9ff', envelope:'#ff6b6b', cake:'#fd79a8' };

  ctx.save();
  ctx.shadowBlur  = LOW_PERF ? 0 : 16;
  ctx.shadowColor = glowMap[food.type] || '#ffd700';
  ctx.font = `${CELL * 1.08 * pulse}px serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(food.emoji, fx, fy);
  ctx.restore();
}

function drawPauseOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 30px Arial Black, Arial';
  ctx.fillText('⏸  PAUSED', canvas.width/2, canvas.height/2 - 22);
  ctx.fillStyle = '#888';
  ctx.font = '14px Arial';
  ctx.fillText('P or Escape to resume', canvas.width/2, canvas.height/2 + 18);
  ctx.restore();
}

function showGameOver() {
  const newBest = score > 0 && score >= loadHi();
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <div class="chinese">${newBest ? '🏆' : '💔'}</div>
    <h2>${newBest ? 'NEW BEST!' : 'NOODLE BROKE!'}</h2>
    <p>Score: <b style="color:#ffd700">${score}</b> &nbsp;|&nbsp; Length: <b style="color:#ffd700">${snake.length}</b><br>
       Best: <b style="color:#ffd700">${loadHi()}</b></p>
    <button id="startBtn">▶ PLAY AGAIN</button>
  `;
  ov.style.display = 'flex';
  document.getElementById('startBtn').addEventListener('click', startGame);
}

// ── Main loop ──────────────────────────────────────────────────────────────
function loop() {
  animFrame++;
  drawBg();

  if (state === 'idle') { requestAnimationFrame(loop); return; }

  if (state === 'dead') {
    deathFrame++;
    drawFood();
    drawNoodle();
    if (deathFrame > 55) { state = 'gameover'; showGameOver(); }
    requestAnimationFrame(loop);
    return;
  }

  drawFood();
  drawNoodle();
  if (state === 'paused') drawPauseOverlay();
  requestAnimationFrame(loop);
}

// ── Music ──────────────────────────────────────────────────────────────────
let _mAC = null, _mTimer = null, _mIdx = 0, musicOn = true;
const MUSIC_SEQ = [
  [392,150],[440,150],[523,300],[440,150],[392,150],[330,300],[294,150],[330,150],[0,150],
  [392,150],[440,150],[523,150],[587,150],[523,300],[440,150],[392,300],[0,300],
  [330,150],[392,150],[440,150],[523,150],[440,300],[392,150],[330,150],[294,300],[0,150],
  [330,150],[294,150],[262,300],[294,150],[262,450],[0,400],
];
function _mNote(freq, durMs) {
  try {
    if (!_mAC) _mAC = new (window.AudioContext || window.webkitAudioContext)();
    if (_mAC.state === 'suspended') _mAC.resume();
    const o = _mAC.createOscillator(), g = _mAC.createGain();
    o.connect(g); g.connect(_mAC.destination);
    o.type = 'triangle'; o.frequency.value = freq;
    const t = _mAC.currentTime;
    g.gain.setValueAtTime(0.07, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + durMs / 1000 * 0.85);
    o.start(t); o.stop(t + durMs / 1000);
  } catch(e) {}
}
function _mAdvance() {
  if (!musicOn || state !== 'playing') return;
  const [freq, dur] = MUSIC_SEQ[_mIdx];
  if (freq) _mNote(freq, dur);
  _mIdx = (_mIdx + 1) % MUSIC_SEQ.length;
  _mTimer = setTimeout(_mAdvance, dur);
}
function eatSound(pts) {
  try {
    if (!_mAC) _mAC = new (window.AudioContext || window.webkitAudioContext)();
    if (_mAC.state === 'suspended') _mAC.resume();
    // pitch scales with food value: 10→523, 30→659, 50→784, 100→ arpeggio
    const freqs = pts >= 100 ? [523,659,784,1047] : pts >= 50 ? [784] : pts >= 30 ? [659] : [523];
    freqs.forEach((f, i) => {
      const o = _mAC.createOscillator(), g = _mAC.createGain();
      o.connect(g); g.connect(_mAC.destination);
      o.type = 'square'; o.frequency.value = f;
      const t = _mAC.currentTime + i * 0.07;
      g.gain.setValueAtTime(0.1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.start(t); o.stop(t + 0.14);
    });
  } catch(e) {}
}
function startMusic() { stopMusic(); if (!musicOn) return; _mIdx = 0; _mAdvance(); }
function stopMusic()  { clearTimeout(_mTimer); _mTimer = null; }
function toggleMusic() {
  musicOn = !musicOn;
  document.getElementById('musicBtn').textContent = musicOn ? '♪ ON' : '♪ OFF';
  if (musicOn && state === 'playing') startMusic(); else stopMusic();
}

// ── Back / Pause ───────────────────────────────────────────────────────────
function goBack() {
  stopMusic();
  if (moveTimer) clearInterval(moveTimer);
  if (window.parent !== window) {
    window.parent.postMessage('exitNoodle', '*');
  } else {
    window.location.href = 'index.html';
  }
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    clearInterval(moveTimer);
    stopMusic();
    document.getElementById('pauseBtn').textContent = '▶ RESUME';
  } else if (state === 'paused') {
    state = 'playing';
    moveTimer = setInterval(step, moveInterval);
    startMusic();
    document.getElementById('pauseBtn').textContent = '⏸ PAUSE';
  }
}

// ── Input ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();

  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }

  if (state === 'idle' || state === 'gameover') {
    if (e.key === ' ' || e.key === 'Enter') startGame();
    return;
  }
  if (state !== 'playing') return;

  switch (e.key) {
    case 'ArrowLeft':  case 'a': if (dir.x !==  1) nextDir = {x:-1,y: 0}; break;
    case 'ArrowRight': case 'd': if (dir.x !== -1) nextDir = {x: 1,y: 0}; break;
    case 'ArrowUp':    case 'w': if (dir.y !==  1) nextDir = {x: 0,y:-1}; break;
    case 'ArrowDown':  case 's': if (dir.y !== -1) nextDir = {x: 0,y: 1}; break;
  }
});

let tx = 0, ty = 0;
canvas.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (state !== 'playing') return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x !== -1) nextDir = {x: 1,y: 0};
    else if (dx < 0 && dir.x !==  1) nextDir = {x:-1,y: 0};
  } else {
    if (dy > 0 && dir.y !== -1) nextDir = {x: 0,y: 1};
    else if (dy < 0 && dir.y !==  1) nextDir = {x: 0,y:-1};
  }
  e.preventDefault();
}, { passive: false });

// ── Boot ───────────────────────────────────────────────────────────────────
if (window.parent !== window) {
  document.querySelector('button[onclick="goBack()"]').style.display = 'none';
}
state = 'idle'; score = 0; animFrame = 0;
snake = [{x:12,y:12}]; dir = {x:1,y:0}; nextDir = {x:1,y:0}; food = null;
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('best').textContent = loadHi();
loop();

let _noodleNatH = 0;
function fitToScreen() {
  const wrap = document.getElementById('wrap');
  if (!_noodleNatH) {
    wrap.style.transform = ''; wrap.style.marginTop = '';
    _noodleNatH = wrap.getBoundingClientRect().height;
  }
  const gameW = COLS * CELL;
  const s = Math.max(0.35, Math.min(window.innerWidth / gameW, window.innerHeight / _noodleNatH, 1));
  wrap.style.transform = `scale(${s})`;
  wrap.style.marginTop = Math.max(0, (window.innerHeight - _noodleNatH * s) / 2) + 'px';
  document.documentElement.style.overflow = (_noodleNatH * s > window.innerHeight) ? 'auto' : 'hidden';
}
window.addEventListener('resize', fitToScreen);
fitToScreen();
</script>
</div><!-- #wrap -->
</body>
</html>
